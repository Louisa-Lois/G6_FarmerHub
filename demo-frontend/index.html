<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmerHub AI — Backend Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 2rem;
  }
  h1 { color: #4ade80; margin-bottom: 0.25rem; }
  .subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 2rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 1.5rem;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 1.25rem;
  }
  .card h2 {
    margin-top: 0;
    font-size: 1.1rem;
    color: #60a5fa;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: #94a3b8;
    margin-top: 0.6rem;
  }
  input {
    width: 100%;
    padding: 0.4rem;
    margin-top: 0.2rem;
    border-radius: 6px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #e2e8f0;
  }
  button {
    margin-top: 1rem;
    width: 100%;
    padding: 0.6rem;
    border: none;
    border-radius: 6px;
    background: #4ade80;
    color: #052e16;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #86efac; }
  button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  .result {
    margin-top: 1rem;
    padding: 0.75rem;
    background: #0f172a;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 1.5rem;
  }
  .result.error { color: #f87171; }
  .result.ok { color: #86efac; }
  .status-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    background: #64748b;
  }
  .status-dot.up { background: #4ade80; }
  .status-dot.down { background: #f87171; }
</style>
</head>
<body>

<h1>🌾 FarmerHub AI — Backend Demo</h1>
<p class="subtitle">
  <span id="status-dot" class="status-dot"></span>
  <span id="status-text">Checking backend...</span>
</p>

<div class="grid">

  <!-- YIELD -->
  <div class="card">
    <h2>Predict Yield</h2>
    <label>Region</label>
    <input id="y-region" value="ASHANTI">
    <label>Crop</label>
    <input id="y-crop" value="MAIZE">
    <label>Year</label>
    <input id="y-year" type="number" value="2024">
    <label>Rainfall (mm)</label>
    <input id="y-rainfall" type="number" value="1300">
    <label>Soil pH</label>
    <input id="y-ph" type="number" value="5.7" step="0.1">
    <label>Organic Matter (%)</label>
    <input id="y-om" type="number" value="6.915" step="0.01">
    <label>Nitrogen (%)</label>
    <input id="y-n" type="number" value="0.26" step="0.01">
    <label>Phosphorus (mg/kg)</label>
    <input id="y-p" type="number" value="3.49" step="0.01">
    <label>CEC</label>
    <input id="y-cec" type="number" value="4.81" step="0.01">
    <label>Region Median Rainfall (mm)</label>
    <input id="y-medrain" type="number" value="1239">
    <label>Potential Yield (Mt/Ha)</label>
    <input id="y-potential" type="number" value="5.5" step="0.1">
    <button onclick="predictYield()">Predict Yield</button>
    <div id="y-result" class="result"></div>
  </div>

  <!-- DISEASE -->
  <div class="card">
    <h2>Detect Disease</h2>
    <label>Upload a leaf photo</label>
    <input id="d-file" type="file" accept="image/*">
    <button onclick="detectDisease()">Detect Disease</button>
    <div id="d-result" class="result"></div>
  </div>

  <!-- ROUTE -->
  <div class="card">
    <h2>Plan Route</h2>
    <label>Grid rows</label>
    <input id="r-rows" type="number" value="10">
    <label>Grid cols</label>
    <input id="r-cols" type="number" value="10">
    <label>Start (row,col)</label>
    <input id="r-start" value="0,0">
    <label>Obstacles (row,col; row,col ...)</label>
    <input id="r-obstacles" value="2,2; 2,3">
    <label>Risk plots (row,col:score, ...)</label>
    <input id="r-risk" value="4,4:0.9, 7,8:0.7, 1,9:0.3">
    <label>Risk threshold</label>
    <input id="r-threshold" type="number" value="0.6" step="0.1">
    <button onclick="planRoute()">Plan Route</button>
    <div id="r-result" class="result"></div>
  </div>

</div>

<script>
const API_BASE = "http://127.0.0.1:8000";

async function checkHealth() {
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const res = await fetch(`${API_BASE}/health`);
    const data = await res.json();
    dot.classList.add('up');
    text.textContent = `Backend is up — ${data.disease_classes_loaded} disease classes loaded`;
  } catch (e) {
    dot.classList.add('down');
    text.textContent = "Backend is unreachable. Is uvicorn running on port 8000?";
  }
}
checkHealth();

function showResult(elId, data, isError) {
  const el = document.getElementById(elId);
  el.textContent = JSON.stringify(data, null, 2);
  el.className = 'result ' + (isError ? 'error' : 'ok');
}

async function predictYield() {
  const body = {
    region: document.getElementById('y-region').value,
    crop: document.getElementById('y-crop').value,
    year: Number(document.getElementById('y-year').value),
    rainfall_mm: Number(document.getElementById('y-rainfall').value),
    soil_ph: Number(document.getElementById('y-ph').value),
    organic_matter: Number(document.getElementById('y-om').value),
    nitrogen: Number(document.getElementById('y-n').value),
    phosphorus: Number(document.getElementById('y-p').value),
    cec: Number(document.getElementById('y-cec').value),
    region_median_rainfall: Number(document.getElementById('y-medrain').value),
    potential_yield: Number(document.getElementById('y-potential').value),
  };
  try {
    const res = await fetch(`${API_BASE}/predict-yield`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    showResult('y-result', data, !res.ok);
  } catch (e) {
    showResult('y-result', { error: e.message }, true);
  }
}

async function detectDisease() {
  const fileInput = document.getElementById('d-file');
  if (!fileInput.files.length) {
    showResult('d-result', { error: 'Choose an image file first' }, true);
    return;
  }
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  try {
    const res = await fetch(`${API_BASE}/detect-disease`, {
      method: 'POST',
      body: formData,
    });
    const data = await res.json();
    showResult('d-result', data, !res.ok);
  } catch (e) {
    showResult('d-result', { error: e.message }, true);
  }
}

function parseObstacles(str) {
  return str.split(';').map(s => s.trim()).filter(Boolean).map(pair => {
    const [r, c] = pair.split(',').map(Number);
    return [r, c];
  });
}

function parseRiskWeights(str) {
  const out = {};
  str.split(',').forEach(entry => {
    const [coord, score] = entry.trim().split(':');
    if (coord && score) out[coord.trim()] = Number(score);
  });
  return out;
}

async function planRoute() {
  const [sr, sc] = document.getElementById('r-start').value.split(',').map(Number);
  const body = {
    rows: Number(document.getElementById('r-rows').value),
    cols: Number(document.getElementById('r-cols').value),
    obstacles: parseObstacles(document.getElementById('r-obstacles').value),
    start: [sr, sc],
    risk_weights: parseRiskWeights(document.getElementById('r-risk').value),
    threshold: Number(document.getElementById('r-threshold').value),
  };
  try {
    const res = await fetch(`${API_BASE}/plan-route`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    showResult('r-result', data, !res.ok);
  } catch (e) {
    showResult('r-result', { error: e.message }, true);
  }
}
</script>

</body>
</html>
